[package]
name = "tiles"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The dock's Tiles (2048), as a program on a card of its own"

# Its own workspace: programs are built for the machine, not the host.
[workspace]

[dependencies]
pandagen_app = { path = "../../pandagen_app", features = ["heap"] }
tiles_core = { path = "../../tiles_core" }

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
