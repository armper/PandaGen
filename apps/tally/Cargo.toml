[package]
name = "tally"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A PandaGen program with a card: a tally counter, drawn by the program"

# Its own workspace: programs are built for the machine, not the host.
[workspace]

[dependencies]
pandagen_app = { path = "../../pandagen_app" }

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
