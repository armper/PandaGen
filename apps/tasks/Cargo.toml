[package]
name = "tasks"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The dock's Tasks, as a program: a to-do list that is a document"

# Its own workspace: programs are built for the machine, not the host.
[workspace]

[dependencies]
pandagen_app = { path = "../../pandagen_app", features = ["heap"] }
tasks_core = { path = "../../tasks_core" }

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
