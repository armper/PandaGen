timeout: 0
default_entry: 0

/PandaGen Desk
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: display=desk remote_token=@REMOTE_TOKEN@

/PandaGen Bootstrap
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: remote_token=@REMOTE_TOKEN@

/PandaGen Bootstrap (graphics desktop)
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: display=graphics remote_token=@REMOTE_TOKEN@
