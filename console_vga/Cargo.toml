[package]
name = "console_vga"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# `src/themes.rs` derives Serialize/Deserialize, so serde is a real runtime
# dependency and not a dev one. It was declared only under dev-dependencies,
# so the library compiled at all only because another workspace member
# happened to put serde in the graph -- `cargo check -p console_vga` alone
# failed while `--workspace` passed.
serde = { workspace = true }

[features]
default = ["alloc"]
alloc = []

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
