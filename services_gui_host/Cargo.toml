[package]
name = "services_gui_host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
view_types = { workspace = true }
input_types = { workspace = true }
serde = { workspace = true }
services_workspace_manager = { workspace = true, optional = true }
graphics_rasterizer = { workspace = true }

[features]
default = ["workspace"]
# Adapter from `services_workspace_manager` render snapshots to desktop
# windows. Off in the bare-metal kernel, where the compositor core is used
# without the (std-only) workspace manager.
workspace = ["dep:services_workspace_manager"]

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
