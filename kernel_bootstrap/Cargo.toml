[package]
name = "kernel_bootstrap"
version = "0.1.0"
edition = "2021"

[lib]
name = "kernel_bootstrap_lib"
path = "src/lib.rs"

[dependencies]
program_image = { path = "../program_image" }
free_list_heap = { path = "../free_list_heap" }
calendar_core = { path = "../calendar_core" }
app_protocol = { path = "../app_protocol", features = ["decode"] }
editor_core = { path = "../editor_core", default-features = false }
limine = { version = "0.5.0", optional = true }
console_vga = { path = "../console_vga", default-features = false, optional = true }
services_storage = { path = "../services_storage", default-features = false, features = ["alloc"] }
input_types = { workspace = true }
view_types = { workspace = true }
identity = { workspace = true }
hal = { path = "../hal", features = ["alloc"] }
hal_x86_64 = { path = "../hal_x86_64" }
net_stack = { workspace = true }
remote_ipc = { workspace = true }
entropy = { workspace = true }
net_tls = { workspace = true }
ipc = { workspace = true }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
# Who may do what to a document (FS-001..003).
authority = { workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
services_command_palette = { path = "../services_command_palette", default-features = false }
services_notification = { path = "../services_notification", default-features = false }
# Desktop compositor core (no workspace-manager adapter on bare metal).
services_gui_host = { path = "../services_gui_host", default-features = false }
graphics_rasterizer = { path = "../graphics_rasterizer" }

[dev-dependencies]
services_workspace_manager = { path = "../services_workspace_manager" }
calculator_core = { path = "../calculator_core" }
tiles_core = { path = "../tiles_core" }
sketch_core = { path = "../sketch_core" }

[features]
default = ["console_vga", "limine"]

[[bin]]
name = "kernel_bootstrap"
path = "src/main.rs"
required-features = ["console_vga", "limine"]
